<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- 关键：移动端视口 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <title>长安区  五校例会02</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
    }

    /* ===== 海报区 ===== */
    .poster {
      height: 100dvh;              /* dvh 适配手机地址栏 */
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                  url("pictures/20210312234339_887ff.png") center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
    }
    .poster--second {
      background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                        url("pictures/20200329183010_eivcs.jpg");
    }
    .poster--third {
      background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                        url("pictures/R-C.jpg");
    }
    .poster h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      line-height: 1.3;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      animation: fade-in 1s ease 0.2s both;
    }
    .poster p {
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      opacity: 0.9;
      animation: fade-in 1s ease 0.7s both;
    }
    .scroll-hint {
      position: absolute;
      bottom: calc(2rem + env(safe-area-inset-bottom));
      font-size: 0.85rem;
      opacity: 0.7;
      animation: bounce 1.5s 1.4s infinite, fade-in-hint 0.8s ease 1.4s both;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fade-in-hint {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* ===== 按钮区：2×2 网格 ===== */
    .buttons {
      position: absolute;
      inset: 0;
      z-index: 1;
      min-height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;   /* 两列 */
      gap: 1rem;
      padding: 2rem 1.25rem calc(5rem + env(safe-area-inset-bottom));
      align-content: center;
    }
    .btn {
      aspect-ratio: 1 / 1;              /* 正方形 */
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s, transform 0.5s, box-shadow 0.2s;
    }
    .btn.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* 手机没有 hover，用 :active 做点击反馈 */
    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn .icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    /* 大屏（平板/电脑）时切回一行四列 */
    @media (min-width: 768px) {
      .buttons {
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        padding: 4rem;
      }
      .btn { aspect-ratio: 1 / 1; font-size: 1.1rem; }
      .btn .icon { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <section class="poster">
    <h1>长安区<br>五校例会02</h1>
    <p>向下滑动，探索更多</p>
    <div class="scroll-hint">↓ 滑动 ↓</div>
  </section>

  <section class="poster poster--second">
    <div class="buttons" id="buttons">
      <a href="page1.html" class="btn"><span class="icon">🎤</span>参展社团</a>
      <a href="page2.html" class="btn"><span class="icon">📅</span>活动日程</a>
      <a href="page3.html" class="btn"><span class="icon">🎫</span>购票信息</a>
      <a href="page4.html" class="btn"><span class="icon">🚇</span>交通指南</a>
    </div>
    <div class="scroll-hint">↓ 继续向下滑动 ↓</div>
  </section>

  <section class="poster poster--third" aria-label="第三张海报">
  </section>

  <script>
    const btns = document.querySelectorAll('.btn');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          btns.forEach((btn, i) => {
            setTimeout(() => btn.classList.add('show'), i * 120);
          });
          observer.disconnect();
        }
      });
    }, { threshold: 0.2 });

    observer.observe(document.getElementById('buttons'));
  </script>

</body>
</html>
